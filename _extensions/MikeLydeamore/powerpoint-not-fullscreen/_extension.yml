title: PowerPoint Not Fullscreen
author: Michael Lydeamore
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, theme.scss]
      css: powerpoint.css
      width: 1280
      height: 720
      margin: 0.06
      transition: none
      background-transition: none
      controls: false
      progress: false
      slide-number: false
      hash: true
      center: true
      navigation-mode: linear
      include-after-body:
        - powerpoint-chrome.html
        - powerpoint-ui.html
